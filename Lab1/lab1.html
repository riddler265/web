<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №1</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kelly+Slab&display=swap" rel="stylesheet">
</head>
<body>
    <table cellspacing="10">
        <thead class="signature">
            <tr>
                <td colspan="2">
                    <h1 >Копылов Егор Вадимович</h1>
                    <h1>P3208 12633</h1>
                </td> 
            </tr>
        </thead>
        <tr>
            <td class="formTd" id="formTd">
                <form id="shootForm" class="shootForm">
                    <div id="parametrSection" class="parametrSection">
                        <legend>Параметр Y</legend>

                        <div>
                            <div class="button">
                                <label for="-2Y">-2</label>
                                <input type="radio" name="ParametrY" id="-2Y" value="-2" required>
                            </div>
                            <div class="button">
                                <label for="-1.5Y">-1.5</label>
                                <input type="radio" name="ParametrY" id="-1.5Y" value="-1.5">
                            </div>
                            <div class="button">
                                <label for="-1Y">-1</label>
                                <input type="radio" name="ParametrY" id="-1Y" value="-1">
                            </div>
                        </div>

                        <div>
                            <div class="button">
                                <label for="-0.5Y">-0.5</label>
                                <input type="radio" name="ParametrY" id="-0.5Y" value="-0.5">
                            </div>
                            <div class="button">
                                <label for="0Y">0</label>
                                <input type="radio" name="ParametrY" id="0Y" value="0">
                            </div>
                            <div class="button">
                                <label for="0.5Y">0.5</label>
                                <input type="radio" name="ParametrY" id="0.5Y" value="0.5">
                            </div>
                        </div>

                        <div>
                            <div class="button">
                                <label for="1Y">1</label>
                                <input type="radio" name="ParametrY" id="1Y" value="1" checked>
                            </div>
                            <div class="button">
                                <label for="1.5Y">1.5</label>
                                <input type="radio" name="ParametrY" id="1.5Y" value="1.5">
                            </div>
                            <div class="button">
                                <label for="2Y">2</label>
                                <input type="radio" name="ParametrY" id="2Y" value="2">
                            </div>
                        </div>
                    </div>


                    <div id="parametrSectionR" class="parametrSection">
                        <legend>Параметр R</legend>

                        <div>
                            <div class="button">
                                <label for="1R">1</label>
                                <input type="radio" name="ParametrR" id="1R" value="1" checked>
                            </div>
                            <div class="button">
                                <label for="1.5R">1.5</label>
                                <input type="radio" name="ParametrR" id="1.5R" value="1.5">
                            </div>
                            <div class="button">
                                <label for="2R">2</label>
                                <input type="radio" name="ParametrR" id="2R" value="2">
                            </div>
                        </div>
                        <div>
                            <div class="button">
                                <label for="2.5R">2.5</label>
                                <input type="radio" name="ParametrR" id="2.5R" value="2.5">
                            </div>
                            <div class="button">
                                <label for="3R">3</label>
                                <input type="radio" name="ParametrR" id="3R" value="3">
                            </div>
                        </div>
                    </div>

                    <div id="parametrSection" class="parametrSection">
                        <label for="parametrX" class="labelForX">Параметр X (-5 ... 3)</label>
                        <input type="text" id="parametrX" name="ParametrX" placeholder="Введите X" required value="1" class="parametrXInput">
                    </div>
                
                    <div class="buttonSection">
                        <button type="submit" class="shootButton">Выстрел</button>
                        <button type="button" class="clearButton">Очистка</button>
                    </div>
                </form>
            </td>
            <td class="coordinateTd", id="coordinateTd">
                <Canvas id="coordinatePlane" class="coordinatePlane" width="800" height="500"></Canvas>
            </td>
        </tr>
        <tr class="footer">
            <td colspan="2" align="center">
                <h2>Результаты</h2>
                <table width="100%" border="1" cellspacing="0" cellpadding="10" id="hitRecordTable" class="hitRecordTable">
                    <thead id="HitRecordThead">
                        <tr>
                            <th>X</th>
                            <th>Y</th>
                            <th>R</th>
                            <th>Попадание</th>
                            <th>Время</th>
                        </tr>
                    </thead>
                </table>
            </td>
        </tr>
    </table>
    <script src="./script.js"></script>
</body>
</html>
